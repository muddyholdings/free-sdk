[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-dot-ai"
version = "0.3.0"
description = "Free.ai Python SDK — access hundreds of AI tools from your code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Free.ai", email = "hello@free.ai"}]
keywords = ["ai", "llm", "chatgpt", "claude", "gemini", "tts", "stt", "image-generation", "free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
async = ["httpx>=0.24.0"]

[project.urls]
Homepage = "https://free.ai"
Documentation = "https://free.ai/api/"
# The freeaigit GitHub account is suspended (verified 2026-09-20: org and
# every repo 404), so the old Repository/Issues URLs sent anyone clicking
# through from PyPI to a dead page. Point at surfaces that resolve until the
# account is restored.
Issues = "https://free.ai/contact/"
Changelog = "https://free.ai/changelog/"

[tool.setuptools.packages.find]
include = ["freeai*"]
